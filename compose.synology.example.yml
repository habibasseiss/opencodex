services:
  9router:
    image: decolua/9router:latest
    ports:
      - "20128:20128"
    volumes:
      - "./9router-data:/app/data"
    environment:
      DATA_DIR: /app/data
      INITIAL_PASSWORD: ${ROUTER_PASSWORD}
    networks: [agent-net]
    restart: unless-stopped

  opencodex:
    image: ghcr.io/<YOUR_GITHUB_USERNAME>/opencodex:latest
    user: "${OPENCODEX_UID}:${OPENCODEX_GID}"
    group_add:
      - "${OPENCODEX_EXTRA_GID}"
    init: true
    read_only: true
    ports:
      - "0.0.0.0:10100:10100"
    environment:
      HOME: /home/bun
      CODEX_HOME: /home/bun/.codex
    volumes:
      - "./opencodex-data/opencodex:/home/bun/.opencodex"
      - "./opencodex-data/codex:/home/bun/.codex"
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [agent-net]

networks:
  agent-net:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:5:5::/64
