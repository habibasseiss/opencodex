services:
  9router:
    image: decolua/9router:latest
    ports:
      - "20128:20128"
    volumes:
      - "./data:/app/data"
    environment:
      DATA_DIR: /app/data
    restart: unless-stopped

  opencodex:
    # Replace YOUR_GITHUB_USERNAME with your GitHub username/organization in lowercase.
    # The image runtime UID/GID are configured at build time using GitHub repository variables.
    image: ghcr.io/YOUR_GITHUB_USERNAME/opencodex:latest

    # Keep the Synology administrators group as a supplementary numeric group if needed
    # by ACLs on the bind-mounted folders. Change/remove this if your NAS differs.
    group_add:
      - "101"

    init: true
    read_only: true
    ports:
      - "0.0.0.0:10100:10100"
    environment:
      HOME: /home/bun
      CODEX_HOME: /home/bun/.codex
    volumes:
      - "./opencodex-data/opencodex:/home/bun/.opencodex"
      - "./opencodex-data/codex:/home/bun/.codex"
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s
