name: Publish OpenCodex image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/opencodex

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out builder repository
        uses: actions/checkout@v4

      - name: Check out upstream OpenCodex
        uses: actions/checkout@v4
        with:
          repository: lidge-jun/opencodex
          ref: main
          path: upstream
          fetch-depth: 1

      - name: Read upstream metadata
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          SHA="$(git -C upstream rev-parse HEAD)"
          SHORT_SHA="$(git -C upstream rev-parse --short=12 HEAD)"
          VERSION="$(jq -r '.version // empty' upstream/package.json)"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare generic runtime Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          cp upstream/Dockerfile upstream/Dockerfile.runtime
          cat docker/runtime-tail.Dockerfile >> upstream/Dockerfile.runtime

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.upstream.outputs.short_sha }}
            type=raw,value=${{ steps.upstream.outputs.version }},enable=${{ steps.upstream.outputs.version != '' }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
