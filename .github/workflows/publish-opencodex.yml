name: Publish OpenCodex image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this upstream release is already published
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/opencodex

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out builder repository
        uses: actions/checkout@v4

      - name: Resolve latest upstream release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="$(gh api repos/lidge-jun/opencodex/releases/latest --jq .tag_name)"
          if [ -z "$TAG" ]; then
            echo "Could not resolve the latest upstream release" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out upstream OpenCodex
        uses: actions/checkout@v4
        with:
          repository: lidge-jun/opencodex
          ref: ${{ steps.release.outputs.tag }}
          path: upstream
          fetch-depth: 1

      - name: Read upstream metadata
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          SHA="$(git -C upstream rev-parse HEAD)"
          SHORT_SHA="$(git -C upstream rev-parse --short=12 HEAD)"
          # Use the released tag, not package.json: main's package.json can be ahead of any release.
          VERSION="${{ steps.release.outputs.tag }}"
          VERSION="${VERSION#v}"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing image
        id: check
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${REGISTRY}/${IMAGE_NAME}:sha-${{ steps.upstream.outputs.short_sha }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Forced rebuild requested."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE already exists; no upstream update, skipping build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "$IMAGE not found; building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare generic runtime Dockerfile
        if: steps.check.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp upstream/Dockerfile upstream/Dockerfile.runtime
          cat docker/runtime-tail.Dockerfile >> upstream/Dockerfile.runtime

      - name: Set up Docker Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        if: steps.check.outputs.build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.upstream.outputs.short_sha }}
            type=raw,value=${{ steps.upstream.outputs.version }},enable=${{ steps.upstream.outputs.version != '' }}

      - name: Build and publish
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
